name: CFB 2025 frozen historical-price pilot

on:
  push:
    branches: [research/cfb-2025-priced-pilot]
    paths:
      - .github/workflows/cfb-2025-priced-pilot.yml

permissions:
  contents: write

concurrency:
  group: cfb-2025-priced-pilot-54bbe1ee5a5b
  cancel-in-progress: false

jobs:
  historical-prices:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENABLE_MLB: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      SPORTS_DATA_DIR: ${{ runner.temp }}/model-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/research/requirements.txt
      - name: Install tested model and research dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/research/requirements.txt
      - name: Verify before any paid request
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Claim single authorization and download encrypted checkpoints
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m research.paid_pilot run \
            --manifest research/pilots/cfb_2025/manifest.json \
            --public-key research/pilots/cfb_2025/public_key.pem \
            --output "${{ runner.temp }}/cfb-2025-private"
      - name: Preserve encrypted recovery files and non-sensitive status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2025-encrypted-recovery-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/cfb-2025-private/sealed/*.json
            ${{ runner.temp }}/cfb-2025-private/public_summary.json
